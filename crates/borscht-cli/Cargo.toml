[package]
name = "borscht-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless runner, benchmarks and image/CSV export for the Borscht evolution simulator."

[[bin]]
name = "borscht"
path = "src/main.rs"

[dependencies]
borscht-core = { path = "../borscht-core", features = ["parallel"] }
# The trainer plays hundreds of battles per generation and they are entirely
# independent of one another, which is the one place in this project where
# threads buy anything.
rayon = "1.10"
